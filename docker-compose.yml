version: "3.9"
services:
  dreamscape:
    container_name: dreamscape
    image: creativegestalt/dreamscape:newui
    environment:
      VITE_DOMAIN: http://${SERVER_HOST}:${SERVER_PORT}
      MONGODB_CONNSTRING: mongodb://${SERVER_HOST}:${DB_PORT}
    ports:
      - "${FRONT_PORT}:8080"
      - "${SERVER_PORT}:3000"
    restart: unless-stopped